<form id="quote-builder-form">
<div class="row g-4">
<div class="col-md-6"><label class="form-label" for="quote-name">Name *</label><input class="form-control" id="quote-name" name="name" required=""/></div>
<div class="col-md-6"><label class="form-label" for="quote-company">Company</label><input class="form-control" id="quote-company" name="company"/></div>
<div class="col-md-6"><label class="form-label" for="quote-country">Country / market *</label><input class="form-control" id="quote-country" name="country" required=""/></div>
<div class="col-md-6"><label class="form-label" for="quote-category">Product category *</label><select class="form-select" id="quote-category" name="category" required=""><option value="">Select a category</option><option>Kitchen cabinets</option><option>Kitchen sinks</option><option>Quartz countertops</option><option>Flooring</option><option>Carpet</option><option>Whole-home package</option><option>Custom furniture</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label" for="quote-project">Project type</label><select class="form-select" id="quote-project" name="project"><option>Residential</option><option>Apartment development</option><option>Hotel / hospitality</option><option>Commercial</option><option>Distribution / wholesale</option><option>Other</option></select></div>
<div class="col-md-6"><label class="form-label" for="quote-quantity">Estimated quantity</label><input class="form-control" id="quote-quantity" name="quantity" placeholder="e.g. 30 kitchens or 500 m²"/></div>
<div class="col-md-6"><label class="form-label" for="quote-destination">Delivery destination</label><input class="form-control" id="quote-destination" name="destination" placeholder="City, port or country"/></div>
<div class="col-md-6"><label class="form-label" for="quote-date">Target delivery date</label><input class="form-control" id="quote-date" name="date" type="date"/></div>
<div class="col-md-6"><label class="form-label" for="quote-finish">Required model / finish</label><input class="form-control" id="quote-finish" name="finish" placeholder="Model, colour, material or finish"/></div>
<div class="col-md-6"><label class="form-label" for="quote-packaging">Packaging requirement</label><input class="form-control" id="quote-packaging" name="packaging" placeholder="Standard export packing or project requirement"/></div>
<div class="col-12"><label class="form-label" for="quote-inspection">Inspection requirement</label><select class="form-select" id="quote-inspection" name="inspection"><option value="">Not specified</option><option>Pre-shipment inspection information required</option><option>Third-party inspection planned</option><option>Please advise available inspection arrangement</option></select></div>
<div class="col-12"><label class="form-label" for="quote-message">Requirements *</label><textarea class="form-control" id="quote-message" name="message" placeholder="Tell us about dimensions, materials, finishes, models or other requirements." required="" rows="5"></textarea></div>
</div>
<div class="d-flex flex-wrap gap-3 mt-4">
<button class="btn btn-primary px-4 py-3" data-quote-channel="email" type="submit"><i class="fa fa-envelope me-2"></i>Open Formatted Email</button>
<button class="btn btn-outline-dark px-4 py-3" data-quote-channel="whatsapp" type="button"><i class="fab fa-whatsapp me-2"></i>Open WhatsApp Message</button>
</div>
<p aria-live="polite" class="text-primary mt-3 mb-0" id="quote-builder-status" role="status"></p>
<p class="small text-muted mt-3 mb-0">After opening email, attach drawings, schedules or reference images before sending.</p>
</form>
